<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fund Wallet — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="topbar">
        <a class="logo brand-logo" href="/dashboard" style="display:flex;align-items:center;"><img
                src="/images/agblogs-logo.jpg" alt="Ablogs" class="brand-img" /></a>
        <a class="btn-out" href="/dashboard" style="width:auto;padding:8px 14px;margin:0;">Dashboard</a>
    </header>
    <div class="wrap">

        <h2>Fund Wallet</h2>
        <div class="card">
            <div class="muted">Current balance</div>
            <div style="font-size:1.5rem;font-weight:800;" id="walletBal">₦0</div>
        </div>
        <div class="card">
            <p class="muted">Get a permanent bank account number. Transfer any amount — it credits after TransactPay
                confirms.</p>
            <label>Phone number</label>
            <input id="vaPhone" type="tel" placeholder="08012345678" />
            <button type="button" class="btn" id="btnCreateVA">Get deposit account number</button>
            <div id="vaBox" class="card" style="display:none;margin-top:14px;background:#0a0a0a;"></div>
        </div>

    </div>
    <div class="toast" id="toast"></div>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script>App.initWallet();</script>
</body>

</html>
