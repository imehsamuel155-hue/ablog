<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Accounts — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="topbar">
        <a class="logo" href="/dashboard">A<span>blogs</span></a>
        <a class="btn-out" href="/dashboard" style="width:auto;padding:8px 14px;margin:0;">Dashboard</a>
    </header>
    <div class="wrap">
        <div class="balance-pill">Balance: <strong id="balPill">₦0</strong> <a href="/wallet">+ Fund</a></div>
        <input class="market-search" id="searchAcct" placeholder="Search..." />
        <select class="cat-select" id="filterCat">
            <option value="">All categories</option>
        </select>
        <div id="acctMarket">
            <p class="muted">Loading…</p>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script>App.initAccounts();</script>
</body>

</html>
