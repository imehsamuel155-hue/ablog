<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Login — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <div class="auth-box">
        <div class="card">
            <h1 style="color:#e11d48;">Ablogs</h1>
            <p class="muted">Welcome back. Login to continue.</p>
            <form id="loginForm">
                <label>Email</label>
                <input id="email" type="email" required placeholder="you@email.com" autocomplete="email" />
                <label>Password</label>
                <input id="password" type="password" required placeholder="••••••••" autocomplete="current-password" />
                <button class="btn" type="submit">Login</button>
            </form>
            <p class="muted" style="margin-top:14px;text-align:center;">
                No account? <a href="/signup" style="color:#fb7185;">Sign up</a>
            </p>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script>App.initLogin();</script>
</body>

</html>
