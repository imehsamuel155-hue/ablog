<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dashboard — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="topbar">
        <a class="logo" href="/dashboard">A<span>blogs</span></a>
        <button type="button" class="btn-out" id="btnLogout"
            style="width:auto;padding:8px 14px;margin:0;">Logout</button>
    </header>
    <div class="wrap">
        <h1>Hello, <span id="userFirst">…</span></h1>
        <div class="balance-pill">Balance: <strong id="walletBal">…</strong> · <a href="/wallet">Fund</a></div>

        <div class="stats-row" id="userStats">
            <div class="mini-stat" style="border-color:#22c55e;"><span class="muted">Lifetime deposit</span><strong
                    id="stLife" style="color:#22c55e;">…</strong></div>
            <div class="mini-stat" style="border-color:#a78bfa;"><span class="muted">All orders</span><strong
                    id="stOrders" style="color:#a78bfa;">…</strong></div>
            <div class="mini-stat" style="border-color:#38bdf8;"><span class="muted">Total funded</span><strong
                    id="stFunded" style="color:#38bdf8;">…</strong></div>
        </div>

        <div class="dash-links">
            <a href="/history">Order History</a>
            <a href="/transactions">Transaction History</a>
            <a href="/working-pictures">Working Pics</a>
            <a href="/tools">Tools</a>
            <a href="/format">Format</a>
            <a href="/wallet">Wallet</a>
            <a href="/profile">Profile</a>
            <a href="#" id="waCommunityLink" style="display:none;">WhatsApp community</a>
        </div>

        <input class="market-search" id="searchAcct" placeholder="Search..." />
        <select class="cat-select" id="filterCat">
            <option value="">All categories</option>
        </select>
        <div id="acctMarket">
            <p class="muted">Please wait…</p>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script>
        // restore cached name/balance to avoid flash
        try {
            const c = JSON.parse(localStorage.getItem('ablogs_user_cache') || 'null');
            if (c) {
                const n = document.getElementById('userFirst');
                const b = document.getElementById('walletBal');
                if (n && c.first) n.textContent = c.first;
                if (b && c.balance != null) b.textContent = '₦' + Number(c.balance).toLocaleString();
            }
        } catch (_) { }
        App.initDashboard();
        App.initAccounts();
    </script>
</body>

</html>
