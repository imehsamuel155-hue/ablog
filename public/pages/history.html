<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Order History — Ablogs</title>
    <link rel="stylesheet" href="/css/style.css" />
</head>

<body>
    <header class="topbar">
        <a class="logo brand-logo" href="/dashboard"
            style="display:flex;align-items:center;gap:8px;text-decoration:none;">
            <img src="/images/agblogs-logo.jpg" alt="Ablogs" class="brand-img" />
            <span class="brand-text">Ablogs</span>
        </a>
        <a class="btn-out" href="/dashboard" style="width:auto;padding:8px 14px;margin:0;">Dashboard</a>
    </header>
    <div class="wrap">

        <h2>Order History</h2>
        <div class="card" id="historyBox">
            <p class="muted">Loading…</p>
        </div>

    </div>
    <div class="toast" id="toast"></div>
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script>App.initHistory();</script>
</body>

</html>
